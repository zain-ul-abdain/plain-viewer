<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Web pages, saved web archives and EPUB books. web.js parses the document with the browser's inert parser, removes
     everything active or outside the file, and shows the result in a frame sandboxed without scripts. That frame
     inherits this policy: style sheets and pictures only from the document itself or the app, nothing else. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://doc.plainviewer.invalid; img-src https://doc.plainviewer.invalid data:; font-src https://doc.plainviewer.invalid; base-uri 'none'; form-action 'none'; object-src 'none'; media-src 'none'; worker-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Web page</title>
<link rel="stylesheet" href="web.css">
</head>
<body>
<iframe id="frame" sandbox="allow-same-origin" title="Document" referrerpolicy="no-referrer"></iframe>
<script type="module" src="web.js"></script>
</body>
</html>
